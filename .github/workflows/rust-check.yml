name: Rust checks

on:
  push:
    branches:
      - fix/contradictions-and-reasoning-traces
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config
      - run: cargo test --locked
      - run: cargo check --locked
      - run: cargo check --locked --bin gui
